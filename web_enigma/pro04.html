<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 04</title>
</head>
<body>

    <script>
        let n1 = Number(prompt("Nota 1: ","11"));
        let n2 = Number(prompt("Nota 2: ","15"));
        let n3 = Number(prompt("Nota 3: ","20"));
        let prom;

        prom = (n1 + n2 + n3) / 3;

        document.write("Nota 1: " + n1 + "<br>");
        document.write("Nota 2: " + n2 + "<br>");
        document.write("Nota 3: " + n3 + "<br>");
        document.write("Promedio final: " + prom + "<br>");
    </script>

    <br>
    <a href="index.html">Regresar al index</a>

</body>
</html>
