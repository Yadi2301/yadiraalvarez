<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 05</title>
</head>
<body>

    <script>
        let precio = Number(prompt("Precio del producto: ","35"));
        let descuento;
        let precioFinal;

        descuento = precio * 0.15;
        precioFinal = precio - descuento;

        document.write("Precio del producto: S/ " + precio + "<br>");
        document.write("Monto de descuento (15%): S/ " + descuento + "<br>");
        document.write("Precio final a pagar: S/ " + precioFinal + "<br>");
    </script>

    <br>
    <a href="index.html">Regresar al index</a>

</body>
</html>
