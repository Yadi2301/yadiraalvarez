<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 03</title>
</head>
<body>

    <script>
        let anioNacimiento = Number(prompt("Año de nacimiento: ","2003"));
        let anioActual = 2026;
        let edad;

        edad = anioActual - anioNacimiento;

        document.write("Año de nacimiento: " + anioNacimiento + "<br>");
        document.write("Año actual: " + anioActual + "<br>");
        document.write("Edad aproximada: " + edad + " años<br>");
    </script>

    <br>
    <a href="index.html">Regresar al index</a>

</body>
</html>
