<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 07</title>
</head>
<body>

    <script>
        let sueldoBruto = Number(prompt("Sueldo mensual bruto: ","1300"));
        let descuento;
        let sueldoFinal;

        descuento = sueldoBruto * 0.13;
        sueldoFinal = sueldoBruto - descuento;

        document.write("Sueldo Bruto: S/ " + sueldoBruto + "<br>");
        document.write("Monto Descontado (13%): S/ " + descuento + "<br>");
        document.write("Sueldo Final Neto: S/ " + sueldoFinal + "<br>");
    </script>

    <br>
    <a href="index.html">Regresar al index</a>

</body>
</html>
