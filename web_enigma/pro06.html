<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 06</title>
</head>
<body>

    <script>
        let totalCuenta = Number(prompt("Monto total de la cuenta: ","159"));
        let personas = Number(prompt("Cantidad de personas: ","5"));
        let pagoCadaUno;

        pagoCadaUno = totalCuenta / personas;

        document.write("Total de la cuenta: S/ " + totalCuenta + "<br>");
        document.write("Cantidad de personas: " + personas + "<br>");
        document.write("Monto a pagar por persona: S/ " + pagoCadaUno + "<br>");
    </script>

    <br>
    <a href="index.html">Regresar al index</a>

</body>
</html>
