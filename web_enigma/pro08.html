<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 08</title>
</head>
<body>

    <script>
        let kilometros = Number(prompt("Cantidad de kilómetros a recorrer: ","18000"));
        let galones;

        galones = kilometros / 40;

        document.write("Kilómetros a recorrer: " + kilometros + " km<br>");
        document.write("Rendimiento del auto: 40 km por galón<br>");
        document.write("Galones de combustible necesarios: " + galones + " galones<br>");
    </script>

    <br>
    <a href="index.html">Regresar al index</a>

</body>
</html>
