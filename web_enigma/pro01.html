<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 01</title>
</head>
<body>

    <script>
        let producto = prompt("Producto: ","gaseosa");
        let precio = Number(prompt("Precio: ","3.20"));
        let cantidad = Number(prompt("Cantidad: ","6"));
        let total;

        total = precio * cantidad;

        document.write("Producto: " + producto + "<br>");
        document.write("Precio: S/ " + precio + "<br>");
        document.write("Cantidad: " + cantidad + "<br>");
        document.write("Total a pagar: S/ " + total + "<br>");

    </script>

    <br>
    <a href="index.html">Regresar al index</a>

</body>
</html>
