<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Problema 09</title>
</head>
<body>

    <script>
        let soles = Number(prompt("Monto en soles (S/): ","240"));
        let tipoCambio = Number(prompt("Tipo de cambio del dólar: ","3.45"));
        let dolares;

        dolares = soles / tipoCambio;

        document.write("Monto en soles: S/ " + soles + "<br>");
        document.write("Tipo de cambio: " + tipoCambio + "<br>");
        document.write("Monto equivalente en dólares: US$ " + dolares + "<br>");
    </script>

    <br>
    <a href="index.html">Regresar al index</a>

</body>
</html>
